<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dave - Health, Lifting & System Architecture</title>
  <style>
    :root {
      --bg: #070b13;
      --nav-bg: #0d1424;
      --border: #1e293b;
      --border-bright: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --purple: #c084fc;
      --green: #34d399;
      --rose: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Top Command Navbar */
    .hub-navbar {
      height: 54px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(192, 132, 252, 0.25));
      border: 1px solid rgba(56, 189, 248, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--blue);
    }

    .brand-text {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .tab-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .tab-group {
      display: inline-flex;
      align-items: center;
      background: #080d18;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active[data-tab="health"] {
      background: rgba(192, 132, 252, 0.2);
      color: var(--purple);
      box-shadow: inset 0 0 0 1px rgba(192, 132, 252, 0.45);
    }

    .tab-btn.active[data-tab="lifting"] {
      background: rgba(251, 113, 133, 0.18);
      color: var(--rose);
      box-shadow: inset 0 0 0 1px rgba(251, 113, 133, 0.45);
    }

    .tab-btn.active[data-tab="architecture"] {
      background: rgba(56, 189, 248, 0.18);
      color: var(--blue);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.45);
    }

    .tab-btn.active[data-tab="interviews"] {
      background: rgba(52, 211, 153, 0.18);
      color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.45);
    }

    .tab-btn.active[data-tab="flashcards"] {
      background: rgba(251, 191, 36, 0.18);
      color: #fbbf24;
      box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.45);
    }

    .sub-pill-wrap {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding-left: 3px;
      border-left: 1px solid var(--border);
    }

    .sub-pill {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 0.71rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .sub-pill:hover {
      color: #fff;
    }

    .sub-pill.active {
      background: rgba(192, 132, 252, 0.28);
      color: #e9d5ff;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.1);
      color: var(--green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .reload-btn {
      background: #080d18;
      border: 1px solid var(--border-bright);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .reload-btn:hover {
      color: #fff;
      border-color: var(--blue);
    }

    /* Full-Viewport Tab Frames (Zero Double Scrollbars) */
    .viewport-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 54px);
      background: var(--bg);
    }

    iframe.hub-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: var(--bg);
    }

    iframe.hub-frame.active {
      display: block;
    }
  </style>
</head>
<body>
  <nav class="hub-navbar">
    <div class="brand">
      <div class="brand-mark">D</div>
      <div class="brand-text">Dave</div>
    </div>

    <div class="tab-bar">
      <div class="tab-group">
        <button class="tab-btn active" data-tab="health" onclick="switchTab('health')">1. Health Tracker</button>
        <div class="sub-pill-wrap">
          <button class="sub-pill active" id="pillOura" onclick="switchHealthSubtab('oura')">Sleep</button>
          <button class="sub-pill" id="pillGarminWorkouts" onclick="switchHealthSubtab('garmin_workouts')">Workouts</button>
          <button class="sub-pill" id="pillGarminDaily" onclick="switchHealthSubtab('garmin_daily')">Biometrics</button>
          <button class="sub-pill" id="pillNutrition" onclick="switchHealthSubtab('nutrition')">Nutrition</button>
          <button class="sub-pill" id="pillLabs" onclick="switchHealthSubtab('labs')">Labs</button>
          <button class="sub-pill" id="pillInsights" onclick="switchHealthSubtab('insights')">Insights</button>
          <button class="sub-pill" id="pillDates" onclick="switchHealthSubtab('dates')">Notes</button>
          <button class="sub-pill" id="pillStepsQa" onclick="switchHealthSubtab('steps_qa')">Steps Analysis</button>
          <button class="sub-pill" id="pillYesterday" onclick="switchHealthSubtab('yesterday')">Yesterday</button>
        </div>
      </div>

      <div class="tab-group">
        <button class="tab-btn" data-tab="lifting" onclick="switchTab('lifting')">2. Weightlifting Tracker</button>
      </div>

      <div class="tab-group">
        <button class="tab-btn" data-tab="architecture" onclick="switchTab('architecture')">3. System Architecture</button>
      </div>

      <div class="tab-group">
        <button class="tab-btn" data-tab="interviews" onclick="switchTab('interviews')">4. Active Interviews</button>
        <div class="sub-pill-wrap">
          <button class="sub-pill active" id="pillHippo" onclick="switchInterviewCompany('hippo')">Hippo</button>
          <button class="sub-pill" id="pillHammer" onclick="switchInterviewCompany('hammer')">Hammer</button>
          <button class="sub-pill" id="pillGeneric" onclick="switchInterviewCompany('generic')">Generic Q/A</button>
        </div>
      </div>

      <div class="tab-group">
        <button class="tab-btn" data-tab="flashcards" onclick="switchTab('flashcards')">5. Flashcards</button>
      </div>
    </div>

    <div class="nav-right">
      <input type="checkbox" id="weed-vis-chk" onchange="toggleGlobalWeed(this.checked)" style="width:12px;height:12px;opacity:0.45;cursor:pointer;accent-color:#34d399;margin:0;" aria-label="Toggle extra insights">
      <span class="status-pill" id="envStatusPill">
        <span class="status-dot"></span>
        <span id="envStatusText">Env</span>
      </span>
      <button class="reload-btn" onclick="reloadActiveFrame()">Refresh</button>
    </div>
  </nav>

  <main class="viewport-wrap">
    <iframe id="frame-health" class="hub-frame active" title="Health Tracker"></iframe>
    <iframe id="frame-lifting" class="hub-frame" title="Weightlifting Tracker"></iframe>
    <iframe id="frame-architecture" class="hub-frame" title="System Architecture"></iframe>
    <iframe id="frame-interviews" class="hub-frame" title="Active Interviews"></iframe>
    <iframe id="frame-flashcards" class="hub-frame" title="Flashcards"></iframe>
  </main>

  <script>
    function toggleGlobalWeed(show) {
      const f = document.getElementById("frame-health");
      if (f && f.contentWindow) {
        f.contentWindow.postMessage({ type: "set-show-weed", show: !!show }, "*");
      }
    }

    const isFileMode = window.location.protocol === "file:";

    function getBaseUrls() {
      if (isFileMode) {
        return {
          health: "../health-tracker/dashboard.html",
          lifting: "../weightlifting-tracker/dashboard.html",
          architecture: "./architecture.html",
          interviews: "./interviews.html",
          flashcards: "./flashcards.html"
        };
      }
      return {
        health: "/embed/health",
        lifting: "/embed/lifting",
        architecture: "/embed/architecture",
        interviews: "/embed/interviews",
        flashcards: "/embed/flashcards"
      };
    }

    const URLS = getBaseUrls();
    const loadedTabs = { health: false, lifting: false, architecture: false, interviews: false, flashcards: false };
    let activeTab = "health";
    let activeHealthSubtab = "yesterday";
    let activeInterviewCompany = "hippo";

    function updateEnvBadge() {
      const txt = document.getElementById("envStatusText");
      const pill = document.getElementById("envStatusPill");
      if (isFileMode) {
        txt.textContent = "Local";
        if (pill) pill.title = "Dave Local PC Mode (5 Repos)";
      } else {
        const host = window.location.host || "dave-pocl.onrender.com";
        txt.textContent = "Live";
        if (pill) pill.title = "Dave Live (" + host + ")";
      }
    }

    function updateHealthSubtabPills(subtab) {
      activeHealthSubtab = (subtab === "garmin_workouts" || subtab === "garmin_daily" || subtab === "nutrition" || subtab === "labs" || subtab === "insights" || subtab === "merged" || subtab === "dates" || subtab === "steps_qa" || subtab === "yesterday") ? subtab : (subtab === "garmin" ? "garmin_workouts" : "oura");
      document.getElementById("pillOura").classList.toggle("active", activeHealthSubtab === "oura");
      if (document.getElementById("pillGarminWorkouts")) document.getElementById("pillGarminWorkouts").classList.toggle("active", activeHealthSubtab === "garmin_workouts");
      if (document.getElementById("pillGarminDaily")) document.getElementById("pillGarminDaily").classList.toggle("active", activeHealthSubtab === "garmin_daily");
      if (document.getElementById("pillNutrition")) document.getElementById("pillNutrition").classList.toggle("active", activeHealthSubtab === "nutrition");
      if (document.getElementById("pillLabs")) document.getElementById("pillLabs").classList.toggle("active", activeHealthSubtab === "labs");
      if (document.getElementById("pillInsights")) document.getElementById("pillInsights").classList.toggle("active", activeHealthSubtab === "insights");
      if (document.getElementById("pillDates")) document.getElementById("pillDates").classList.toggle("active", activeHealthSubtab === "dates");
      if (document.getElementById("pillStepsQa")) document.getElementById("pillStepsQa").classList.toggle("active", activeHealthSubtab === "steps_qa");
      if (document.getElementById("pillYesterday")) document.getElementById("pillYesterday").classList.toggle("active", activeHealthSubtab === "yesterday");
    }

    function buildHealthUrl(subtab) {
      const base = URLS.health;
      if (subtab === "garmin_workouts" || subtab === "garmin_daily" || subtab === "nutrition" || subtab === "labs" || subtab === "insights" || subtab === "merged" || subtab === "dates" || subtab === "steps_qa" || subtab === "yesterday") {
        return base + (base.includes("?") ? "&" : "?") + "subtab=" + subtab;
      }
      if (subtab === "garmin") {
        return base + (base.includes("?") ? "&" : "?") + "subtab=garmin_workouts";
      }
      return base;
    }

    function updateInterviewPills(company) {
      activeInterviewCompany = (company === "hammer" || company === "generic") ? company : "hippo";
      if (document.getElementById("pillHippo")) document.getElementById("pillHippo").classList.toggle("active", activeInterviewCompany === "hippo");
      if (document.getElementById("pillGeneric")) document.getElementById("pillGeneric").classList.toggle("active", activeInterviewCompany === "generic");
      if (document.getElementById("pillHammer")) document.getElementById("pillHammer").classList.toggle("active", activeInterviewCompany === "hammer");
    }

    function buildInterviewsUrl(company) {
      const base = URLS.interviews;
      const target = (company === "hammer" || company === "generic") ? company : "hippo";
      return base + (base.includes("?") ? "&" : "?") + "company=" + target;
    }

    function ensureLoaded(tabName, forceReload = false) {
      const frame = document.getElementById("frame-" + tabName);
      if (!frame) return;
      if (!loadedTabs[tabName] || forceReload) {
        if (tabName === "health") {
          frame.src = buildHealthUrl(activeHealthSubtab);
        } else if (tabName === "interviews") {
          frame.src = buildInterviewsUrl(activeInterviewCompany);
        } else {
          frame.src = URLS[tabName];
        }
        loadedTabs[tabName] = true;
      }
    }

    function switchTab(tabName) {
      const target = (tabName === "lifting" || tabName === "architecture" || tabName === "interviews" || tabName === "flashcards") ? tabName : "health";
      activeTab = target;

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === target);
      });

      document.querySelectorAll(".hub-frame").forEach((f) => {
        f.classList.toggle("active", f.id === "frame-" + target);
      });

      ensureLoaded(target, false);
    }

    function switchHealthSubtab(subtab) {
      const normalized = (subtab === "garmin_workouts" || subtab === "garmin_daily" || subtab === "nutrition" || subtab === "labs" || subtab === "insights" || subtab === "merged" || subtab === "dates" || subtab === "steps_qa" || subtab === "yesterday") ? subtab : (subtab === "garmin" ? "garmin_workouts" : "oura");
      updateHealthSubtabPills(normalized);
      switchTab("health");

      const frame = document.getElementById("frame-health");
      if (frame) {
        if (loadedTabs.health && frame.contentWindow) {
          try {
            frame.contentWindow.postMessage({ type: "set-health-subtab", subtab: normalized }, "*");
            return;
          } catch (e) {}
        }
        frame.src = buildHealthUrl(normalized);
        loadedTabs.health = true;
      }
    }

    function switchInterviewCompany(company) {
      const normalized = (company === "hammer" || company === "generic") ? company : "hippo";
      updateInterviewPills(normalized);
      switchTab("interviews");

      const frame = document.getElementById("frame-interviews");
      if (frame) {
        frame.src = buildInterviewsUrl(normalized);
        loadedTabs.interviews = true;
      }
    }

    function reloadActiveFrame() {
      ensureLoaded(activeTab, true);
    }

    function resolveInitialTab() {
      const params = new URLSearchParams(window.location.search || "");
      const qTab = (params.get("tab") || "").toLowerCase();
      const qSub = (params.get("subtab") || "").toLowerCase();
      const hash = (window.location.hash || "").replace(/^#/, "").toLowerCase();
      const path = (window.location.pathname || "").toLowerCase();
      const injected = (window.__INITIAL_TAB__ || "").toLowerCase();

      if (qSub === "dates" || injected === "dates" || qTab === "dates" || hash === "dates") {
        updateHealthSubtabPills("dates");
        return "health";
      }
      if (qSub === "insights" || injected === "insights" || qTab === "insights" || hash === "insights") {
        updateHealthSubtabPills("insights");
        return "health";
      }
      if (qSub === "yesterday" || injected === "yesterday" || qTab === "yesterday" || hash === "yesterday") {
        updateHealthSubtabPills("yesterday");
        return "health";
      }
      if (qSub === "merged" || injected === "merged" || qTab === "merged" || hash === "merged") {
        updateHealthSubtabPills("merged");
        return "health";
      }
      if (qSub === "nutrition" || injected === "nutrition" || qTab === "nutrition" || hash === "nutrition") {
        updateHealthSubtabPills("nutrition");
        return "health";
      }
      if (qSub === "garmin_workouts" || injected === "garmin_workouts" || qTab === "garmin_workouts" || hash === "garmin_workouts" || qSub === "garmin" || injected === "garmin" || qTab === "garmin" || hash === "garmin") {
        updateHealthSubtabPills("garmin_workouts");
        return "health";
      }
      if (qSub === "garmin_daily" || injected === "garmin_daily" || qTab === "garmin_daily" || hash === "garmin_daily") {
        updateHealthSubtabPills("garmin_daily");
        return "health";
      }
      if (qTab === "interviews" || injected === "interviews" || hash === "interviews" || path.includes("interviews")) {
        return "interviews";
      }
      if (qTab === "flashcards" || injected === "flashcards" || hash === "flashcards" || path.includes("flashcards")) {
        return "flashcards";
      }
      if (qTab === "lifting" || injected === "lifting" || hash === "lifting" || path.includes("lifting") || path.includes("weightlifting")) {
        return "lifting";
      }
      if (qTab === "architecture" || injected === "architecture" || hash === "architecture" || path.includes("architecture")) {
        return "architecture";
      }
      updateHealthSubtabPills("yesterday");
      return "health";
    }

    updateEnvBadge();
    updateInterviewPills(activeInterviewCompany);
    const initial = resolveInitialTab();
    switchTab(initial);
  </script>
</body>
</html>
